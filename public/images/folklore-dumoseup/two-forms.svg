<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">한 사람의 두 모습</title>
  <desc id="desc">사람 모습에서는 말과 손을 쓰고, 제비 모습에서는 날개로 난다. 스스로 모습을 바꾸지만 기억과 상처, 살아온 시간은 이어진다. 옷과 짐은 그 자리에 남는다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#37675b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#f4eddf"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" fill="#243b34" text-anchor="middle">
    <text x="600" y="94" font-size="22" letter-spacing="5">두모습</text>
    <text x="600" y="158" font-size="48" font-weight="700">한 사람, 두 가지 모습</text>
    <rect x="70" y="224" width="440" height="350" rx="24" fill="#fffaf0" stroke="#cdbd9f" stroke-width="2"/>
    <rect x="690" y="224" width="440" height="350" rx="24" fill="#e2ebe4" stroke="#9eb8a7" stroke-width="2"/>
    <g stroke="#37675b" stroke-width="9" stroke-linecap="round" fill="none">
      <circle cx="290" cy="318" r="28"/>
      <path d="M242 420V392Q242 361 290 361Q338 361 338 392V420M290 364V423"/>
      <path d="M827 315Q878 322 910 358Q938 318 989 290Q970 348 929 370L953 405L915 387L884 417L895 376Q854 359 827 315Z" stroke-width="6" fill="#37675b"/>
    </g>
    <text x="290" y="489" font-size="36" font-weight="700">사람 모습</text>
    <text x="290" y="535" font-size="26">말하고, 손으로 만든다</text>
    <text x="910" y="489" font-size="36" font-weight="700">제비 모습</text>
    <text x="910" y="535" font-size="26">날개로 날아간다</text>
    <path d="M542 358H658" fill="none" stroke="#37675b" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="600" y="421" font-size="26" font-weight="700">스스로</text>
    <text x="600" y="458" font-size="26" font-weight="700">바꾼다</text>
    <text x="600" y="626" font-size="27">옷과 짐은 그 자리에 남는다</text>
    <rect x="70" y="681" width="1060" height="145" rx="24" fill="#294e43"/>
    <text x="600" y="738" fill="#fffaf0" font-size="29" font-weight="700">기억 · 상처 · 살아온 시간</text>
    <text x="600" y="784" fill="#e2ebe4" font-size="28">어느 모습이든, 같은 삶이 이어진다</text>
    <text x="600" y="867" fill="#58675c" font-size="20">제비 모습을 가진 한 주민의 예 · 창작 세계의 규칙</text>
  </g>
</svg>
