<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">들메 — 걸어가는 집들의 시대: 네 분지와 이동길</title>
  <desc id="map-desc">창작 세계 들메의 축척 없는 관계도. 북서 모랫들에는 1월과 2월, 북동 갈숲벌에는 4월과 5월, 남동 붉은나루에는 7월과 8월, 남서 먹실림에는 10월과 11월 서리띠가 지난다. 서리띠는 시계 방향으로 움직이며, 각 가구는 인접한 두 터를 왕복한다. 중앙 돌등은 서리띠를 피하는 고원이지만 농지와 물이 부족하다. 북문고개는 북쪽의 좁은 관문이고, 빈마루는 움직이지 못하는 옛집들의 터다.</desc>
  <defs>
    <pattern id="paper" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".7" fill="#9c916f" opacity=".13"/>
      <circle cx="25" cy="23" r=".6" fill="#9c916f" opacity=".12"/>
    </pattern>
    <marker id="frost-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#608696" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="field" stroke="#8b8e59" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M0 24 L41 8 L82 24 L41 41 Z" fill="#ddd9ad"/>
      <path d="M14 21 L54 37 M27 16 L67 32 M40 11 L79 26 M23 26 L23 11 M19 16 L23 20 L28 13 M40 31 L40 17 M36 22 L40 26 L45 19 M58 25 L58 11 M54 16 L58 20 L63 13"/>
    </g>
    <g id="forest" stroke="#607659" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 43 V61 M39 30 V59 M66 44 V62" fill="none"/>
      <path d="M1 44 L13 14 L25 44 Z M22 38 L39 0 L56 38 Z M52 46 L66 13 L80 46 Z" fill="#afba95"/>
      <path d="M25 47 L39 17 L53 47 Z" fill="#bcc7a2"/>
    </g>
    <g id="walking-house" stroke="#625c45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 56 L10 71 L0 74 M34 58 L31 78 L22 82 M54 58 L57 77 L66 80 M73 56 L80 70 L91 73 M21 48 L10 57 L2 61 M67 48 L82 55 L89 62" fill="none"/>
      <path d="M14 23 L74 23 L74 58 L14 58 Z" fill="#e4d4af"/>
      <path d="M5 26 L28 3 L67 7 L84 28 Z" fill="#b59f71"/>
      <path d="M28 3 L43 27 M67 7 L61 27" fill="none" stroke="#827957" stroke-width="2"/>
      <path d="M39 36 L51 36 L51 58 L39 58 Z" fill="#897454"/>
      <path d="M21 36 L30 36 L30 45 L21 45 Z M60 36 L67 36 L67 45 L60 45 Z" fill="#f7f0d9" stroke-width="2"/>
      <path d="M13 59 L75 59" stroke-width="4"/>
    </g>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; fill: #344c40; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
      .place { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .season { font-size: 24px; fill: #416d80; }
      .center { text-anchor: middle; }
      .card { stroke: #aab095; stroke-width: 2; }
      .road { fill: none; stroke: #b4945a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .frost { fill: none; stroke: #608696; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; marker-end: url(#frost-arrow); }
      .sidepath { fill: none; stroke: #a5ad98; stroke-width: 3; stroke-dasharray: 3 8; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f5f0df"/>
  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect x="20" y="20" width="1160" height="860" rx="18" fill="none" stroke="#d6cdb4" stroke-width="2"/>
  <text class="title" x="60" y="70">들메 — 걸어가는 집들의 시대</text>
  <text class="body" x="60" y="109" fill="#70765e">네 분지와 이동길</text>
  <text class="small" x="1140" y="105" text-anchor="end" fill="#70765e">창작 세계도 · 원전 지도 아님</text>

  <!-- The seasonal band moves clockwise around four basins. -->
  <path class="frost" d="M287 144 C435 119 768 119 916 144"/>
  <path class="frost" d="M1148 267 C1170 309 1170 425 1148 470"/>
  <path class="frost" d="M915 642 C763 671 437 671 286 642"/>
  <path class="frost" d="M52 471 C30 428 30 308 52 265"/>

  <!-- Ochre routes link adjacent basins; muted dotted routes reach the plateau. -->
  <path class="road" d="M431 266 L769 266"/>
  <path class="road" d="M951 329 L951 438"/>
  <path class="road" d="M249 329 L249 438"/>
  <path class="road" d="M432 548 L453 548 L453 622 L747 622 L747 548 L768 548"/>
  <path class="sidepath" d="M432 315 L484 359 M768 315 L716 359 M432 464 L484 423 M768 464 L716 423"/>

  <!-- Northern pass, plateau and old fixed houses. -->
  <rect x="484" y="169" width="232" height="79" rx="17" fill="#e8e3cd" stroke="#b8b49d" stroke-width="2"/>
  <text class="body center" x="600" y="201" font-weight="700">북문고개</text>
  <text class="small center" x="600" y="231">좁은 관문</text>
  <path d="M557 246 L567 266 M643 246 L633 266" stroke="#8f977c" stroke-width="3" fill="none"/>

  <path d="M506 327 L542 301 L661 306 L703 334 L725 380 L709 432 L667 459 L532 454 L477 426 L474 365 Z" fill="#dbe1c9" stroke="#9ca88b" stroke-width="2"/>
  <path d="M506 342 L533 321 L659 324 L685 345 M495 420 L539 440 L665 442 L695 421" fill="none" stroke="#bbc4a8" stroke-width="2"/>
  <text class="place center" x="600" y="357">돌등</text>
  <text class="body center" x="600" y="391">서리띠를 피하는 고원</text>
  <text class="body center" x="600" y="428">농지·물 부족</text>

  <rect x="478" y="490" width="244" height="114" rx="17" fill="#eae2ce" stroke="#bab39c" stroke-width="2"/>
  <text class="body center" x="600" y="523" font-weight="700">빈마루</text>
  <text class="body center" x="600" y="557">움직이지 못하는</text>
  <text class="body center" x="600" y="588">옛집들의 터</text>

  <!-- Four basins, each with a six-legged timber-and-cloth dwelling. -->
  <rect class="card" x="62" y="176" width="372" height="156" rx="24" fill="#eee5c5"/>
  <text class="place" x="88" y="221">모랫들</text>
  <text class="season" x="88" y="257">서리 1~2월</text>
  <use href="#walking-house" x="304" y="208"/>
  <use href="#field" transform="translate(90 281) scale(.8)"/>
  <path d="M185 304 Q206 285 229 304 Q250 285 273 304" fill="none" stroke="#c1b582" stroke-width="3"/>

  <rect class="card" x="766" y="176" width="372" height="156" rx="24" fill="#e5ead4"/>
  <text class="place" x="792" y="221">갈숲벌</text>
  <text class="season" x="792" y="257">서리 4~5월</text>
  <use href="#walking-house" x="1008" y="208"/>
  <use href="#field" transform="translate(792 281) scale(.8)"/>
  <path d="M890 312 L890 279 M890 293 L882 283 M890 301 L899 288 M916 312 L916 273 M916 287 L907 277 M916 298 L925 285 M943 312 L943 281 M943 295 L934 285 M943 302 L952 290" fill="none" stroke="#87926e" stroke-width="2.5" stroke-linecap="round"/>

  <rect class="card" x="766" y="439" width="372" height="156" rx="24" fill="#efdfce"/>
  <text class="place" x="792" y="484">붉은나루</text>
  <text class="season" x="792" y="520">서리 7~8월</text>
  <use href="#walking-house" x="1008" y="471"/>
  <use href="#field" transform="translate(792 544) scale(.8)"/>
  <path d="M886 562 Q904 551 924 562 T963 562 M886 574 Q904 563 924 574 T963 574" fill="none" stroke="#8ca6a6" stroke-width="3" stroke-linecap="round"/>

  <rect class="card" x="62" y="439" width="372" height="156" rx="24" fill="#dfe6d3"/>
  <text class="place" x="88" y="484">먹실림</text>
  <text class="season" x="88" y="520">서리 10~11월</text>
  <use href="#walking-house" x="304" y="471"/>
  <use href="#field" transform="translate(89 544) scale(.8)"/>
  <use href="#forest" transform="translate(195 534) scale(.7)"/>

  <!-- Legend and calendar. -->
  <path d="M60 697 L1140 697" stroke="#d2cab2" stroke-width="2"/>
  <path class="road" d="M65 733 L119 733"/>
  <text class="body" x="135" y="741">인접 분지 이동길</text>
  <path class="frost" d="M405 733 L459 733"/>
  <text class="body" x="475" y="741">서리띠 · 시계 방향</text>
  <path class="sidepath" d="M790 733 L844 733"/>
  <text class="body" x="860" y="741">고원 연결길</text>
  <text class="body" x="65" y="786" font-weight="700">한 가구는 인접한 두 터를 왕복한다.</text>
  <text class="body" x="65" y="824">1년 360일 · 한 달 30일 · 사이달 3 / 6 / 9 / 12월에는 서리띠가 변두리를 통과</text>
  <text class="small" x="65" y="858" fill="#747660">집은 여섯 나무다리로 걷는다. 밭과 숲은 땅에 남는다.</text>
  <text class="small" x="1135" y="858" text-anchor="end" fill="#747660">축척 없는 관계도</text>
</svg>
