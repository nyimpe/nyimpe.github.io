<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">해명 — 알려진 대륙 동남부의 지리</title>
  <desc id="map-desc">북쪽 백두령 산맥 아래 솔문 산국이 있으며, 서쪽 쇳골 연맹에서 흐르는 쇳물이 중앙의 긴내에 합류한다. 긴내는 금라 폐허와 여울 왕국을 지나 남쪽 잔등성에서 새벽바다로 흐른다. 동남 해안과 섬에는 섬바람 해맹이 있다. 쇳골과 금라 사이의 북벽문은 지하 남굴 도시권의 출입구다. 영역의 색은 대략적인 세력 분포이고 점선은 통행로다.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#e7dbbe"/>
    </linearGradient>
    <pattern id="sea-lines" width="44" height="36" patternUnits="userSpaceOnUse">
      <path d="M7 18q7-3 14 0t14 0" fill="none" stroke="#69898b" stroke-width="1" opacity=".16"/>
    </pattern>
    <pattern id="dark-field" width="25" height="22" patternUnits="userSpaceOnUse">
      <path d="M7 16l4-5m6 5 3-4" stroke="#766e59" stroke-width="1" opacity=".23"/>
    </pattern>
    <g id="peak">
      <path d="M-20 14 0-22 23 14M0-22 5-3 13-7M0-22-5-1-12 4" fill="#ddd5bd" stroke="#686b58" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M0-18 2-3 16 11" fill="none" stroke="#686b58" opacity=".5" stroke-width="1.1"/>
    </g>
    <g id="tree">
      <path d="M0 11V-7M-8 4 0-9 8 4M-6-2 0-13 6-2" fill="none" stroke="#627363" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="city">
      <circle r="7" fill="#f4ecd8" stroke="#3d423a" stroke-width="2.2"/>
      <circle r="2.4" fill="#3d423a"/>
    </g>
    <g id="gateway">
      <path d="M-9 7V-4Q0-17 9-4V7M-13 7H13" fill="#e9dec4" stroke="#514f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-3 6V-3Q0-7 3-3V6" fill="#514f45"/>
    </g>
    <style>
      text { font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #343e36; }
      .name { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
      .place { font-size: 20px; font-weight: 600; }
      .small { font-size: 16px; }
      .quiet { fill: #677061; }
      .halo { paint-order: stroke; stroke: #f0e7d0; stroke-width: 6px; stroke-linejoin: round; }
      .route { fill: none; stroke: #9b7853; stroke-width: 2.6; stroke-dasharray: 4 8; stroke-linecap: round; }
      .river { fill: none; stroke: #688f95; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect x="24" y="24" width="1152" height="852" rx="3" fill="none" stroke="#8b8269" stroke-width="1.4"/>
  <rect x="32" y="32" width="1136" height="836" rx="2" fill="none" stroke="#b4a88b" stroke-width=".7"/>

  <!-- The coastline is invented; no real-world political borders are implied. -->
  <path d="M34 113H889L908 170 885 219 916 259 887 309 910 351 885 393 932 438 903 481 925 524 890 564 914 597 870 634 858 657 798 671 773 697 713 714 660 739 608 735 562 757 492 752 449 768 382 752 313 761 252 743 201 760 147 747 90 759 34 747Z" fill="#849c97" opacity=".11" transform="translate(9 7)"/>
  <path d="M34 113H889L908 170 885 219 916 259 887 309 910 351 885 393 932 438 903 481 925 524 890 564 914 597 870 634 858 657 798 671 773 697 713 714 660 739 608 735 562 757 492 752 449 768 382 752 313 761 252 743 201 760 147 747 90 759 34 747Z" fill="#eee5ce" stroke="#737e6b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M966 204q13-10 22 2t-5 24q-19 4-17-26Zm28 174 17-15 17 15-5 26-21 1Zm-10 179q29-14 39 7l-9 31-26 2-12-19Zm-32 93 19-9 18 13-3 28-22 16-18-18Zm91 43 23-8 11 16-9 19-25-2Zm-181 30 22-6 20 15-17 18-28-8Z" fill="#e9e2cb" stroke="#737e6b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M940 218H1155V806H726q29-33 89-39 70-45 119-82 2-219 6-467Z" fill="url(#sea-lines)"/>

  <!-- Soft region washes indicate influence, not surveyed borders. -->
  <path d="M510 223q122-31 292-9l69 107-57 79-92-4-74-33-116 9-44-83Z" fill="#9dac86" opacity=".24"/>
  <path d="M180 242 321 205l140 60 31 79-39 110-162 18-122-79Z" fill="#a49379" opacity=".17"/>
  <path d="M513 441q87-57 199-23l108 58 14 139-93 66-111 53-116-23-71-112Z" fill="#d0b979" opacity=".22"/>
  <path d="M878 473q116-41 185 48l42 194-80 57-159-17-68-55 69-66 28-98Z" fill="#80a2a1" opacity=".15"/>
  <path d="M67 356 132 324 207 358 213 476 141 510 72 469Z" fill="url(#dark-field)"/>

  <text x="65" y="88" font-size="42" font-weight="700" letter-spacing="8">해명</text>
  <text x="194" y="82" font-size="18" fill="#6e7467">알려진 대륙의 동남부</text>
  <path d="M65 101H368" stroke="#8b8269" stroke-width="1"/>
  <text x="637" y="101" class="small quiet" text-anchor="middle">산맥 너머와 먼바다는 이 지도에 담지 않았다</text>

  <!-- Baekduryeong, with an intentional pass at Hwinjae. -->
  <g>
    <use href="#peak" x="140" y="188"/><use href="#peak" x="176" y="177"/>
    <use href="#peak" x="212" y="189"/><use href="#peak" x="249" y="177"/>
    <use href="#peak" x="286" y="185"/><use href="#peak" x="324" y="164"/>
    <use href="#peak" x="362" y="180"/><use href="#peak" x="400" y="170"/>
    <use href="#peak" x="438" y="182"/><use href="#peak" x="476" y="168"/>
    <use href="#peak" x="514" y="182"/><use href="#peak" x="551" y="173"/>
    <use href="#peak" x="587" y="181"/>
    <use href="#peak" x="666" y="179"/><use href="#peak" x="706" y="167"/>
    <use href="#peak" x="743" y="183"/><use href="#peak" x="782" y="173"/>
    <use href="#peak" x="820" y="189"/><use href="#peak" x="856" y="177"/>
  </g>
  <text x="376" y="143" class="place" text-anchor="middle" letter-spacing="7">백두령 산맥</text>
  <path d="M623 148Q618 193 642 236L680 286" class="route"/>
  <text x="626" y="137" class="small" text-anchor="middle">흰재</text>
  <path d="M626 146v14" stroke="#7b7964"/>

  <!-- Long River and its western tributary. -->
  <path d="M590 195q25 39 15 78t-14 76q-2 24 11 55t-5 71q-28 41-13 79t17 75q2 45 29 71l29 37" class="river" stroke-width="5"/>
  <path d="M333 315q25 25 58 40t61 21q35 8 65 25t85 3" class="river" stroke-width="3.8"/>
  <path d="M630 700q-14 29-23 35M642 716q28 8 45 13" class="river" stroke-width="2.3"/>
  <text x="566" y="514" class="small" fill="#527c85" transform="rotate(84 566 514)">긴내</text>
  <text x="438" y="409" class="small halo" fill="#527c85">쇳물</text>

  <!-- Passes and main land routes. -->
  <path d="M322 315 387 311 433 330 486 357 548 410Q613 356 680 286" class="route"/>
  <path d="M548 410q-28 114 7 204l93 80" class="route"/>
  <path d="M322 315q-67 77-119 110" class="route"/>
  <path d="M680 286q84 23 167 91l49 91" class="route"/>
  <path d="M657 705q96 53 184 20t124-60" class="route"/>

  <g opacity=".72">
    <use href="#tree" x="729" y="303"/><use href="#tree" x="749" y="312"/><use href="#tree" x="770" y="302"/>
    <use href="#tree" x="739" y="334"/><use href="#tree" x="761" y="337"/><use href="#tree" x="787" y="328"/>
    <use href="#tree" x="809" y="301"/><use href="#tree" x="802" y="350"/>
    <use href="#tree" x="695" y="352"/><use href="#tree" x="719" y="365"/>
    <use href="#peak" x="385" y="266"/><use href="#peak" x="427" y="269"/>
    <use href="#peak" x="451" y="301"/><use href="#peak" x="388" y="357"/>
  </g>

  <text x="700" y="236" class="name" text-anchor="middle">솔문 산국</text>
  <use href="#city" x="680" y="286"/>
  <text x="694" y="285" class="place halo">솔문성</text>

  <text x="282" y="251" class="name" text-anchor="middle">쇳골 연맹</text>
  <use href="#city" x="322" y="315"/>
  <text x="308" y="311" class="place halo" text-anchor="end">쇳골</text>
  <text x="306" y="334" class="small halo quiet" text-anchor="end">의회도시</text>
  <text x="149" y="426" class="place" text-anchor="middle" letter-spacing="3">검은벌</text>

  <text x="422" y="237" class="small" text-anchor="middle">구름고개</text>
  <use href="#gateway" x="433" y="330"/>
  <text x="466" y="328" class="place halo">북벽문</text>
  <text x="466" y="350" class="small halo quiet">남굴의 지상 출입구</text>

  <path d="M541 408v-10h8v-5h9v15m-21 6h24m-17-6v6m12-6v6" fill="#ede2c7" stroke="#665e4d" stroke-width="2"/>
  <text x="537" y="448" class="place halo" text-anchor="end">금라 폐허</text>
  <text x="537" y="473" class="small halo quiet" text-anchor="end">옛 왕조의 수도</text>

  <text x="706" y="509" class="name" text-anchor="middle">여울 왕국</text>
  <text x="706" y="538" class="small quiet" text-anchor="middle" letter-spacing="3">긴내를 따라 펼쳐진 평야</text>
  <g fill="none" stroke="#a29365" stroke-width="1.4" opacity=".46">
    <path d="m662 590 50-7 2 29-50 7Zm63-10 40-5 2 29-40 6M683 588l2 26m20-28 2 27m33-35 2 28"/>
    <path d="m457 524 50 8-5 34-50-8m23-31-5 34m-12-19 47 8"/>
  </g>
  <use href="#city" x="648" y="694"/>
  <text x="674" y="683" class="place halo">잔등성</text>
  <text x="674" y="708" class="small halo quiet">잔등나루 · 긴내 하구</text>

  <text x="996" y="480" class="name" text-anchor="middle" fill="#476d71">섬바람 해맹</text>
  <text x="996" y="506" class="small quiet" text-anchor="middle">동남 해안과 섬의 연맹</text>
  <use href="#city" x="965" y="665"/>
  <text x="992" y="651" class="place halo">등섬</text>
  <text x="992" y="676" class="small halo quiet">해맹 의회</text>
  <text x="1037" y="319" font-size="27" fill="#5b7e82" letter-spacing="7" text-anchor="middle">새벽바다</text>
  <text x="834" y="795" class="small" fill="#5b7e82" letter-spacing="4" text-anchor="middle">새벽바다</text>

  <!-- North / east compass. -->
  <g transform="translate(1080 159)">
    <path d="M0-41-10 4 0-3 10 4Z" fill="#53665c"/>
    <path d="M0-3V37M-28 9H30" stroke="#7b826c" stroke-width="1.5"/>
    <text x="0" y="-52" font-size="18" font-weight="700" text-anchor="middle">북</text>
    <text x="40" y="15" font-size="16">동</text>
    <circle cy="9" r="20" fill="none" stroke="#90947b" stroke-width=".8"/>
  </g>

  <!-- Subterranean inset is explicitly separate from the surface territories. -->
  <g transform="translate(72 605)">
    <rect width="324" height="185" rx="4" fill="#f3ebd6" stroke="#9a927a" stroke-width="1.2"/>
    <text x="20" y="32" font-size="22" font-weight="700">남굴 도시권</text>
    <text x="20" y="56" class="small quiet">지하 공간 · 지상 영토와 별개</text>
    <path d="M36 98q13 14 43 14t41 22q17 13 47 1t43-9q19 6 66-10" fill="none" stroke="#a4977c" stroke-width="11" stroke-linecap="round"/>
    <path d="M36 98q13 14 43 14t41 22q17 13 47 1t43-9q19 6 66-10" class="route"/>
    <use href="#gateway" x="36" y="98"/>
    <text x="56" y="93" class="small">북벽문 연결</text>
    <use href="#city" x="190" y="127"/>
    <text x="196" y="159" class="place">온돌원</text>
  </g>

  <path d="M65 817H1135" stroke="#a29678" stroke-width="1"/>
  <g transform="translate(76 840)" class="small">
    <use href="#city" x="0" y="-5"/>
    <text x="18" y="0">도시·거점</text>
    <use href="#gateway" x="155" y="-5"/>
    <text x="173" y="0">지하 출입구</text>
    <path d="M303-5H351" class="route"/>
    <text x="364" y="0">주요 통행로</text>
    <rect x="512" y="-16" width="25" height="18" rx="3" fill="#9dac86" opacity=".45"/>
    <text x="549" y="0">옅은 색: 대략적인 세력권 · 확정 국경 아님</text>
  </g>
  <text x="600" y="862" font-size="13" fill="#716e5f" text-anchor="middle">개략도 · 국가의 위치와 통행 관계를 표시하며 거리 축척은 일정하지 않다</text>
</svg>
