      <article>
        <header class="post-header">
          <h1>Hole.io — 도시를 삼키는 구멍</h1>
          <time datetime="2026-07-23">2026.07.23</time>
        </header>
        <p>작은 구멍을 움직여 도시의 사물을 삼키는 게임입니다. 작은 물건부터 먹으면서 몸집을 키워 보세요. 제한 시간은 90초입니다.</p>
        <p class="game-instructions"><kbd>방향키</kbd> 또는 <kbd>W A S D</kbd>로 이동합니다. 터치나 마우스는 원하는 방향을 누른 채 움직이세요.</p>
        <div class="game-stage landscape" data-game="hole-io" data-state="idle">
          <div id="game-container" class="game-container" tabindex="0" role="region" aria-label="Hole.io — 도시를 삼키는 구멍 게임 화면" aria-describedby="keyboard-help"></div>
          <div class="game-placeholder">
            <span class="game-symbol" aria-hidden="true">🕳</span>
            <p class="game-status" role="status">준비되면 시작해 보세요.</p>
            <button id="start-game" class="plain-button" type="button">게임 시작</button>
          </div>
        </div>
        <p class="game-instructions" id="keyboard-help">키보드로 조작할 때는 게임 화면을 클릭하거나 Tab으로 선택해 주세요.</p>
        <div class="game-actions">
          <button id="restart-game" class="plain-button" type="button" hidden>다시 시작</button>
          <a href="/">← 모든 기록 보기</a>
